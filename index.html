<!DOCTYPE=html>
<html lang="“ja”">
<head>
  <style>
    CSS
.btn-square {
  display: inline-block;
  padding: 0.5em 1em;
  text-decoration: none;
  background: #668ad8;/*ボタン色*/
  color: #FFF;
  border-bottom: solid 4px #627295;
  border-radius: 3px;
}
.btn-square:active {
  /*ボタンを押したとき*/
  -webkit-transform: translateY(4px);
  transform: translateY(4px);/*下に動く*/
  border-bottom: none;/*線を消す*/
}
  </style>
</head>
<body>
  <a href="https://m.youtube.com/" class="btn-square">Youtube</a>
  <h1></h1>
  <a href="https://www.netflix.com/jp/" class="btn-square">Netflix</a>
</body>
